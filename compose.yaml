services:
  nenova-brochure:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8093
      NODE_ENV: production
      COOKIE_SECURE: "true"
    ports:
      - "127.0.0.1:8093:8093"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
